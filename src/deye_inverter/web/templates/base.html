<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Deye Inverter</title>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="brand">Deye Inverter</div>
    <nav class="nav">
      {% for path, (name, label) in pages.items() %}
      <a href="{{ path }}" class="{{ 'active' if name == page else '' }}">{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="topbar-right">
      <span class="mode-badge" id="mode-badge">…</span>
      <form method="post" action="/logout"><button class="link-button" type="submit">Log out</button></form>
    </div>
  </header>
  <main class="content">
    <h1>{{ title }}</h1>
    <div class="notice" id="notice" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script type="module" src="/static/js/layout.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
